{% extends 'base.html' %}

{% block title %}Change Password - KPPIMES{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-header bg-primary text-white"><h4 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Change Password</h4></div>
            <div class="card-body p-4">
                {% if request.user.force_password_change %}<p class="text-muted">Set a new password to continue.</p>{% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_current_password" class="form-label">Temporary Password</label>
                        <input type="password" name="current_password" id="id_current_password" class="form-control" required autocomplete="current-password">
                    </div>
                    <div class="mb-3">
                        <label for="id_new_password1" class="form-label">New Password</label>
                        <input type="password" name="new_password1" id="id_new_password1" class="form-control" required autocomplete="new-password">
                    </div>
                    <div class="mb-4">
                        <label for="id_new_password2" class="form-label">Confirm New Password</label>
                        <input type="password" name="new_password2" id="id_new_password2" class="form-control" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Change Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
