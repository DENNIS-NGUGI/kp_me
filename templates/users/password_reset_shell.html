{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - KP M&E System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>body{background:linear-gradient(135deg,#f5f7f5 0%,#e8f5e9 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;padding:1rem}.reset-card{background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);max-width:420px;width:100%;overflow:hidden}.reset-header{background:linear-gradient(135deg,#1a5632,#2d8a4e);padding:30px 40px;text-align:center;color:#fff}.reset-header img{max-height:50px}.reset-body{padding:30px 40px 40px}.btn-primary{background:#1a5632;border-color:#1a5632;padding:12px;border-radius:8px;font-weight:600}.btn-primary:hover{background:#2d8a4e;border-color:#2d8a4e}.form-control{border-radius:8px;padding:12px 16px}.form-control:focus{border-color:#1a5632;box-shadow:0 0 0 .2rem rgba(26,86,50,.25)}.reset-body a{color:#1a5632}</style>
</head>
<body><main class="reset-card"><header class="reset-header"><img src="{% static 'images/coat.png' %}" alt="KP Logo" class="img-fluid mb-2"><h2 class="h4 mb-1">KP M&amp;E System</h2><p class="mb-0 small">Kenya Population Programme</p></header><section class="reset-body"><h1 class="h4 mb-2">{{ heading }}</h1><p class="text-muted">{{ description }}</p>{% include content_template %}</section></main></body>
</html>
