{% if validlink %}<form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary w-100" type="submit">Update Password</button></form>{% else %}<p class="text-muted mb-3">This reset link is invalid or has expired.</p><a class="btn btn-outline-success w-100" href="{% url 'users:password_reset' %}">Request a New Link</a>{% endif %}
