{% extends 'base.html' %}

{% block title %}{% if sdg %}Edit{% else %}Add{% endif %} SDG - KPPIMES{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><h3 class="page-title mb-0">{% if sdg %}Edit{% else %}Add{% endif %} SDG</h3><a href="{% url 'indicators:sdg_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i></a></div>
<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-body p-4"><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-4"><label class="form-label fw-semibold">SDG Number</label><input class="form-control" type="number" min="1" max="17" name="number" value="{{ sdg.number|default:'' }}" required></div><div class="col-md-8"><label class="form-label fw-semibold">Title</label><input class="form-control" name="title" value="{{ sdg.title|default:'' }}" required></div><div class="col-12"><label class="form-label fw-semibold">Description</label><textarea class="form-control" name="description" rows="4">{{ sdg.description|default:'' }}</textarea></div><div class="col-md-4"><label class="form-label fw-semibold">Sort Order</label><input class="form-control" type="number" min="0" name="sort_order" value="{{ sdg.sort_order|default:'' }}"></div><div class="col-md-4 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if not sdg or sdg.is_active %}checked{% endif %}><label class="form-check-label" for="is_active">Active</label></div></div></div><hr><button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i>Save SDG</button><a class="btn btn-outline-secondary" href="{% url 'indicators:sdg_list' %}">Cancel</a></form></div></div></div></div>
{% endblock %}
