{% extends 'base.html' %}

{% block title %}Delete {{ title }} - ICPD{% endblock %}

{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body p-4">
    <h4>Delete {{ title }}</h4><p class="text-muted">Are you sure you want to delete <strong>{{ object }}</strong>? Related planning records will also be removed.</p>
    <form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit"><i class="bi bi-trash me-1"></i>Delete</button><a class="btn btn-outline-secondary" href="{% url 'icpd:dashboard' %}">Cancel</a></form>
</div></div></div></div>
{% endblock %}
